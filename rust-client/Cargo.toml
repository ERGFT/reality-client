[package]
name = "reality-client-rs"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
android-bridge-check = []

[dependencies]
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }
libloading = "0.8.9"
jni = "=0.22.4"
serde_json = "1"
url = "2.5.8"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "socks-proxy"] }
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Networking_WinInet", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
rfd = "0.17.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service"] }
rfd = "0.17.2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"
keyring-core = "=1.0.0"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
slint-build = "1.18.1"

name: Rust client Linux

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "rust-client/**"
      - "third_party/vpn-core.rev"
      - "xtask/**"
      - ".cargo/**"
      - ".github/workflows/rust-linux.yml"
  pull_request:
    paths:
      - "rust-client/**"
      - "third_party/vpn-core.rev"
      - "xtask/**"
      - ".cargo/**"
      - ".github/workflows/rust-linux.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional published release tag to build and attach this Linux package to"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag) || github.sha }}
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            cmake nasm pkg-config unzip \
            python3 \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev \
            libwayland-dev libx11-xcb-dev libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Fetch pinned vpn-core (Cargo dependency of the client)
        run: cargo xtask fetch-core
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path rust-client/Cargo.toml --check
          cargo fmt --manifest-path xtask/Cargo.toml --check
      - name: Run xtask static analysis
        run: cargo clippy --manifest-path xtask/Cargo.toml --locked -- -D warnings
      - name: Run Rust static analysis
        run: cargo clippy --manifest-path rust-client/Cargo.toml --locked --all-targets -- -D warnings -A dead_code
      - name: Run client unit and local FFI tests
        run: cargo test --manifest-path rust-client/Cargo.toml --locked
      - name: Check Android JNI bridge types without an Android SDK
        run: cargo check --manifest-path rust-client/Cargo.toml --features android-bridge-check --locked
      - name: Smoke-test user-local Linux installer
        run: bash rust-client/tests/linux-installer-smoke.sh
      - name: Smoke-test Android JNI export validator
        run: bash rust-client/tests/android-exports-smoke.sh
      - name: Build and package Linux client
        run: bash rust-client/build-linux.sh
      - name: Prepare Linux release archive and checksum
        run: |
          tar -C rust-client/dist -czf rust-client/dist/RealityClient-Rust-linux-x86_64.tar.gz linux-x86_64
          cd rust-client/dist
          sha256sum RealityClient-Rust-linux-x86_64.tar.gz > SHA256SUMS-linux-x86_64.txt
      - name: Upload Linux package for device testing
        uses: actions/upload-artifact@v7
        with:
          name: reality-client-linux-x86_64
          path: |
            rust-client/dist/linux-x86_64/
            rust-client/dist/RealityClient-Rust-linux-x86_64.tar.gz
            rust-client/dist/SHA256SUMS-linux-x86_64.txt
          if-no-files-found: error
          retention-days: 14

  publish-linux-release:
    if: (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || startsWith(github.ref, 'refs/tags/v')
    needs: build-linux-x86_64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Linux release artifact
        uses: actions/download-artifact@v8
        with:
          name: reality-client-linux-x86_64
          path: dist
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            docs/releases
      - name: Attach Linux archive and checksum to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.event_name == 'workflow_dispatch' && inputs.release_tag) || github.ref_name }}
        run: |
          bash .github/scripts/publish-release.sh "$RELEASE_TAG" \
            dist/RealityClient-Rust-linux-x86_64.tar.gz \
            dist/SHA256SUMS-linux-x86_64.txt

name: Rust client Android

on:
  push:
    paths:
      - "rust-client/**"
      - "third_party/vpn-core.rev"
      - "scripts/fetch-core.*"
      - ".github/workflows/rust-android.yml"
  pull_request:
    paths:
      - "rust-client/**"
      - "third_party/vpn-core.rev"
      - "scripts/fetch-core.*"
      - ".github/workflows/rust-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Set Android environment
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch pinned vpn-core (Cargo dependency of the client)
        run: bash scripts/fetch-core.sh third_party/vpn-core

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust-client/Cargo.toml --check

      - name: Build Android ARM64 APK
        run: bash rust-client/build-android.sh

      - name: Upload Android APK for device testing
        uses: actions/upload-artifact@v7
        with:
          name: reality-client-android-arm64-debug
          path: rust-client/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

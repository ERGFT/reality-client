name: Rust client Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "rust-client/**"
      - "third_party/vpn-core.rev"
      - "xtask/**"
      - ".cargo/**"
      - ".github/workflows/rust-android.yml"
  pull_request:
    paths:
      - "rust-client/**"
      - "third_party/vpn-core.rev"
      - "xtask/**"
      - ".cargo/**"
      - ".github/workflows/rust-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-arm64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: rustfmt

      - name: Install Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Set Android environment
        shell: bash
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Fetch pinned vpn-core (Cargo dependency of the client)
        run: cargo xtask fetch-core

      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust-client/Cargo.toml --check

      - name: Build Android ARM64 APK
        run: bash rust-client/build-android.sh

      - name: Prepare Android release file and checksum
        run: |
          mkdir -p release
          cp rust-client/android/app/build/outputs/apk/debug/app-debug.apk release/RealityClient-Rust-android-arm64-debug.apk
          cd release
          sha256sum RealityClient-Rust-android-arm64-debug.apk > SHA256SUMS-android-arm64.txt

      - name: Upload Android APK for device testing
        uses: actions/upload-artifact@v7
        with:
          name: reality-client-android-arm64-debug
          path: |
            release/RealityClient-Rust-android-arm64-debug.apk
            release/SHA256SUMS-android-arm64.txt
          if-no-files-found: error
          retention-days: 14

  publish-android-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-android-arm64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            docs/releases
      - name: Download Android release artifact
        uses: actions/download-artifact@v8
        with:
          name: reality-client-android-arm64-debug
          path: dist
      - name: Create the release if needed and attach the APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publish-release.sh "$GITHUB_REF_NAME" \
            dist/RealityClient-Rust-android-arm64-debug.apk \
            dist/SHA256SUMS-android-arm64.txt

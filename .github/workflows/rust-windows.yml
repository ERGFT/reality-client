name: Rust client Windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "rust-client/**"
      - "third_party/vpn-core.rev"
      - "xtask/**"
      - ".cargo/**"
      - "third_party/wintun/**"
      - ".github/workflows/rust-windows.yml"
  pull_request:
    paths:
      - "rust-client/**"
      - "third_party/vpn-core.rev"
      - "xtask/**"
      - ".cargo/**"
      - "third_party/wintun/**"
      - ".github/workflows/rust-windows.yml"

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MinGW build tools
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
      - name: Install Rust GNU toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-gnu
          components: rustfmt, clippy
      - name: Configure core build environment
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "RUSTFLAGS=-C link-arg=-static" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RUSTUP_TOOLCHAIN=stable-x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "AWS_LC_SYS_PREBUILT_NASM=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Fetch pinned vpn-core (Cargo dependency of the client)
        run: cargo xtask fetch-core
      - name: Check Rust formatting
        run: cargo fmt --manifest-path rust-client/Cargo.toml --check
      - name: Run Rust static analysis
        run: cargo clippy --manifest-path rust-client/Cargo.toml --locked --features android-bridge-check --all-targets --target x86_64-pc-windows-gnu -- -D warnings -A dead_code
      - name: Build pinned vpn-core command-line program
        env:
          REALITY_MINGW_BIN: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin
        run: cargo xtask core-cli
      - name: Run Windows Rust tests
        run: |
          cargo test --manifest-path rust-client/Cargo.toml --features android-bridge-check --locked --target x86_64-pc-windows-gnu
      - name: Build Windows package
        env:
          REALITY_MINGW_BIN: ${{ steps.msys2.outputs.msys2-location }}\mingw64\bin
        run: cargo xtask package-windows
      - name: Verify packaged files
        shell: pwsh
        run: |
          $package = 'rust-client\dist\windows-x64'
          foreach ($file in @('RealityClient-Rust.exe', 'Reality Client Rust.lnk', 'wintun.dll', 'WINTUN-LICENSE.txt', 'LICENSE.txt', 'THIRD_PARTY.md', 'README.md', 'third_party\reality-client.exe', 'CORE-SOURCE.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path $package $file))) {
              throw "Missing packaged file: $file"
            }
          }
      - name: Prepare Windows release archive and checksum
        shell: pwsh
        run: |
          $dist = 'rust-client\dist'
          $zip = Join-Path $dist 'RealityClient-Rust-windows-x64.zip'
          Compress-Archive -Path (Join-Path $dist 'windows-x64\*') -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RealityClient-Rust-windows-x64.zip" | Set-Content -LiteralPath (Join-Path $dist 'SHA256SUMS-windows-x64.txt') -Encoding ascii
      - name: Upload Windows x64 package
        uses: actions/upload-artifact@v7
        with:
          name: reality-client-windows-x64
          path: |
            rust-client/dist/windows-x64/
            rust-client/dist/RealityClient-Rust-windows-x64.zip
            rust-client/dist/SHA256SUMS-windows-x64.txt
          if-no-files-found: error
          retention-days: 14

  publish-windows-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows-x64
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            docs/releases
      - name: Download Windows release artifact
        uses: actions/download-artifact@v8
        with:
          name: reality-client-windows-x64
          path: dist
      - name: Create the release if needed and attach the Windows archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/publish-release.sh "$GITHUB_REF_NAME" \
            dist/RealityClient-Rust-windows-x64.zip \
            dist/SHA256SUMS-windows-x64.txt
